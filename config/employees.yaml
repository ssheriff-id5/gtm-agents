# The team. One entry per AI employee; the key is what you pass to `--employee`.
# Notion is the source of truth for job descriptions (Team Roster); this file holds
# only what code needs to act *as* the employee (identity, IDs, schedule).
#
# schedule.cron is in UTC (GitHub Actions cron is UTC). Keep it in sync with the
# matching .github/workflows/*.yml — Abby uses it to decide which runs were "expected".

team:
  timezone: UTC                     # TODO(open decision #4): confirm team timezone for Run Date / due dates
  slack_channel: "#revops-ai-team"  # TODO(open decision #2): replace with the channel ID (C0123...) once created
  human_owner: satiesh              # key into config/humans.yaml — default escalation point

employees:
  abby:
