name: Abby · Daily review

# Phase 3: add the cron (scheduled after the juniors' runs) and the headless Claude run.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, live]
        default: dry-run
  # schedule:
  #   - cron: "0 8 * * 1-5"   # TODO(open decision #4): after Rick/Stevey finish

concurrency: abby-daily-review

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVOPS_MODE: ${{ inputs.mode || 'live' }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Job contract smoke test (until manager-review lands in Phase 3)
        run: python -m lib.cli smoke-test --employee abby
